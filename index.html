<style>
:root{--a:#0f766e;--card:#fff;--tx:#12302e;--mu:#5b7774;--bd:#cfe3e0;--fi:#f1f8f7;--gr:#15803d;--rd:#dc2626;--am:#b45309;
--ac:var(--a);--bg1:var(--a);--bg2:color-mix(in srgb,var(--a) 55%,#000);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,color-mix(in srgb,var(--bg1) 60%,transparent) 0%,color-mix(in srgb,var(--bg2) 82%,transparent) 100%) fixed,var(--bgimg) center center/cover no-repeat fixed,var(--bg2);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:6px 0 10px;color:#fff;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{display:flex;align-items:center;gap:6px;flex:none}
.clk{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.clk b{font-size:13px;font-weight:700;letter-spacing:.2px}.clk span{font-size:10px;opacity:.9}
@media(max-width:520px){.clk{padding:2px 6px}.clk b{font-size:11.5px}.clk span{font-size:9px}}
.gear{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;font-size:18px;padding:4px 10px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);padding:6px 0;z-index:2;background:color-mix(in srgb,var(--bg1) 90%,transparent)}
nav button{flex:1;padding:9px 4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
nav button.on{background:var(--card);color:var(--ac);border-color:var(--card)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .full{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--fi);color:var(--tx);font-size:13px;min-width:0}
input[type=color]{padding:2px;height:38px}input[type=range]{padding:0}
label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}
.btn{padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;font-size:13px}
.btn.full{width:100%}.btn.g{background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--tx)}.btn.r{background:var(--rd);color:#fff}
.btn.sm{padding:8px 12px}.btn.sel{outline:3px solid var(--ac);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:15px}.stat span{font-size:10px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mu{color:var(--mu);font-size:12px}
.ib{border:0;background:none;font-size:15px;padding:0 5px;color:var(--ac)}.ib.d{color:var(--rd)}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.gr{color:var(--gr)}.rd{color:var(--rd)}.am{color:var(--am)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac)}
.sw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.empty{text-align:center;color:#fff;padding:18px;opacity:.85}
select.inl{width:auto;padding:5px;font-size:12px}input.inl{width:auto;padding:5px;font-size:12px}
.note{color:#fff;opacity:.9;font-size:12px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--card);color:var(--ac);font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5}
#ov{position:fixed;inset:0;background:rgba(0,10,40,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#ov.on{display:flex}#box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:85vh;overflow:auto}
#box h3{margin:0 0 10px;font-size:15px}.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}
.sw8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.dot.sel{border-color:var(--tx)}
h2{font-size:13px;margin:0 0 8px}.f{margin-bottom:8px}
.k textarea,textarea{resize:vertical;min-height:110px;font-family:inherit;line-height:1.4}
.flt{display:flex;gap:6px;margin:6px 0}.mini{width:auto;padding:5px 8px;font-size:12px;border-radius:8px;background:var(--card)}
.kv{margin-top:6px}.k{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--bd);min-width:0;word-break:break-word}
.k>span{flex:0 0 84px;font-size:11px;color:var(--mu);padding-top:3px}.k>div{flex:1;min-width:0}
.k select,.k input{padding:4px 6px;font-size:12px;width:auto;max-width:100%}.pre{white-space:pre-wrap}.t{font-size:14px}
input[type=checkbox]{width:auto;padding:0}.chk{display:flex;flex-wrap:wrap;gap:6px}
label.ck{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx);background:var(--fi);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;margin:0}
#ov2{position:fixed;inset:0;background:rgba(0,10,40,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov2.on{display:flex}#box2{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px}#box2 h3{margin:0 0 10px;font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111;color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.on{opacity:1}
.bad{border-color:var(--rd)!important}
.dd{border:1px solid var(--bd);border-radius:8px;background:var(--fi)}.dd summary{padding:9px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:6px;font-size:13px}
.dd summary::-webkit-details-marker{display:none}.dd summary::after{content:"▾"}.dd[open] summary::after{content:"▴"}
.dd .chk{flex-direction:column;gap:4px;padding:8px;border-top:1px solid var(--bd);max-height:180px;overflow:auto}.dd label.ck{width:100%;background:var(--card)}

async function sbPush(){
  const cur=rowsOf(),c=SB.client;

  for(const t of SBT){const up=[];cur[t].forEach((r,id)=>{if(SB.last[t].get(id)!==JSON.stringify(r))up.push(r)});
    for(let k=0;k<up.length;k+=500){const {error}=await c.from(t).upsert(up.slice(k,k+500),{onConflict:"id"});if(error)throw error}}
  for(const t of [...SBT].reverse()){const del=[];SB.last[t].forEach((j,id)=>{if(!cur[t].has(id))del.push(id)});
    for(let k=0;k<del.length;k+=200){const {error}=await c.from(t).delete().in("id",del.slice(k,k+200));if(error)throw error}}
  const cj=JSON.stringify(S.cfg);
  if(cj!==SB.lastCfg){const {error}=await c.from("app_settings").upsert({user_id:SB.uid,data:S.cfg,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;SB.lastCfg=cj}

async function sbRun(){

    SB.retry=0;setStatus("☁ Saved to Supabase")}
  catch(e){SB.dirty=true;SB.retry++;setStatus("⚠ Not saved to Supabase yet: "+(e.message||e)+" (retrying)");if(SB.retry===1)toast("Supabase save failed – will retry");
    clearTimeout(SB.timer);SB.timer=setTimeout(sbRun,Math.min(30000,2000*SB.retry))}

async function sbStart(session){
  SB.uid=session.user.id;SB.loading=true;
  try{
    setStatus("☁ Loading from Supabase…");
    const cl2=await sbFetch();
    const hasCloud=cl2.customers.length||cl2.jobs.length||cl2.tx.length||cl2.inv.length||cl2.acts.length;
    const hasLocal=S.customers.length||S.jobs.length||S.tx.length||S.inv.length||S.acts.length;
    if(!hasCloud&&hasLocal){
      SB.last=Object.fromEntries(SBT.map(t=>[t,new Map()]));SB.lastCfg="";
      S.acts.forEach(a=>(a.photos||[]).forEach(id=>{if(String(PH[id]||"").startsWith("data:")&&!PHP[id])sbUpload(id,PH[id],a.id)}));
    }else{
      if(hasLocal&&hasCloud)try{localStorage.setItem("wmt_local_backup",JSON.stringify(S))}catch(e){}
      S={customers:cl2.customers,jobs:cl2.jobs,tx:cl2.tx,inv:cl2.inv,acts:cl2.acts,cfg:cl2.cfg?mergeCfg(cl2.cfg):S.cfg};
      Object.keys(PHP).forEach(k=>delete PHP[k]);Object.assign(PHP,cl2.php);
      fixNums();apply(S.cfg);
      SB.last=lastOf(rowsOf());SB.lastCfg=cl2.cfg?JSON.stringify(S.cfg):"";
    }
    SB.on=true;SB.loading=false;hide();render();sbWatch();
    SB.dirty=true;await sbRun();
    if(!SB.dirty&&!SB.retry){try{localStorage.removeItem("wmt")}catch(e){}}
  }catch(e){SB.loading=false;SB.on=false;setStatus("⚠ Could not load from Supabase: "+(e.message||e)+" — working locally");toast("Supabase load failed")}
}

function sbApplyNext(id,val){

  j.next=val;

async function sbPullNext(){
  if(!SB.on||SB.dirty||SB.busy||SB.loading||document.hidden)return;
  try{const {data,error}=await SB.client.from("projects").select("id,next_visit");if(error)throw error;
    if(SB.dirty||SB.busy)return;(data||[]).forEach(r=>sbApplyNext(r.id,r.next_visit))}catch(e){}

function sbWatch(){
  if(SB.ch||!SB.client)return;
  try{SB.ch=SB.client.channel("wmt-next-visit").on("postgres_changes",{event:"*",schema:"public",table:"projects"},p=>{
    if(SB.dirty||SB.busy||SB.loading||!p.new||!p.new.id)return;sbApplyNext(p.new.id,p.new.next_visit)}).subscribe()}catch(e){}
  document.addEventListener("visibilitychange",sbPullNext);
  setInterval(sbPullNext,30000);
}

  if(!t.dataset.set)return;
  const it=S[t.dataset.k].find(x=>x.id===t.dataset.id);if(!it)return;
  if(await ask("Change "+t.dataset.set+" to “"+t.value+"”?","Yes, change")){it[t.dataset.set]=t.value;save()}
  render();
});

/* views */
let flt={mode:"all",val:""};
const inF=d=>flt.mode==="all"||!flt.val||String(d||"").startsWith(flt.val);
function dueTag(d,st){
  if(!d||st==="Completed")return"";
  const diff=Math.round((new Date(d)-new Date(today()))/864e5);
  const c=diff<0?"rd":diff<=2?"am":"mu";
  const l=diff<0?`overdue ${-diff}d`:diff===0?"today":diff===1?"tomorrow":`in ${diff}d`;
  return`<span class="${c}" style="font-size:11px;margin-left:6px">${l}</span>`;
}
const stat=(b,l,c,k)=>`<div class="stat ${k||(c?"s-"+c:"")}"><b class="${c||""}">${b}</b><span>${l}</span></div>`;
const th=h=>h.map(([l,c])=>`<th class="${c||""}">${esc(l)}</th>`).join("");
const tbl=(head,rows,minw,empty,cls)=>`<div class="tw"><table class="dt ${cls||""}" style="min-width:${minw}px"><thead><tr>${th(head)}</tr></thead><tbody>${rows||`<tr><td class="none" colspan="${head.length}">${empty}</td></tr>`}</tbody></table></div>`;
const act=(k,id,noDel)=>`<td class="act"><button class="ib" data-act="edit" data-k="${k}" data-id="${id}" title="Edit">✎</button>${noDel?"":`<button class="ib d" data-act="del" data-k="${k}" data-id="${id}" title="Delete">✕</button>`}</td>`;
const ell=(s,b)=>`<td class="ell" title="${esc(s)}">${b?`<b>${esc(s)}</b>`:esc(s)||"—"}</td>`;
let selProj=null;
const known=id=>S.jobs.some(j=>j.id===id);
const sumA=a=>a.reduce((s,x)=>s+x.amt,0);
const col=n=>n>0?"gr":n<0?"rd":"";
const sgn=n=>(n>0?"+":n<0?"−":"")+num(Math.abs(n));
const mrow=(l,val,c)=>`<div class="m"><span>${l}</span><b class="${c||""}">${val}</b></div>`;
function projs(){const a=[...S.jobs].sort((x,y)=>(+x.num||0)-(+y.num||0));
  if(S.tx.some(t=>!known(t.job))||S.inv.some(i=>!known(i.job)))a.push({id:"__none",num:"–",name:"Unassigned"});return a}
function pFin(pid){
  const mine=x=>pid==="__none"?!known(x.job):x.job===pid;
  const tx=S.tx.filter(t=>mine(t)&&inF(t.date)),inv=S.inv.filter(i=>mine(i)&&inF(i.date));
  const income=sumA(tx.filter(t=>t.type==="Income")),exp=sumA(tx.filter(t=>t.type==="Expense")),invd=sumA(inv),paid=sumA(inv.filter(i=>i.status==="Paid"));
  return{tx,inv,income,exp,net:income-exp,invd,paid,pend:invd-paid,diff:invd-exp};
}
const acBtns=(k,id,noDel)=>`<div class="ac"><button class="ib" data-act="edit" data-k="${k}" data-id="${id}" title="Edit">✎</button>${noDel?"":`<button class="ib d" data-act="del" data-k="${k}" data-id="${id}" title="Delete">✕</button>`}</div>`;
function vWork(){
  const list=S.jobs.filter(j=>inF(j.next)).sort((a,b)=>(a.next?0:1)-(b.next?0:1)||(a.next||"").localeCompare(b.next||"")||(+a.num||0)-(+b.num||0));
  const open=list.filter(j=>j.status!=="Completed").length;
  const cards=list.map(j=>`<div class="pc" data-rid="${j.id}">
  <div class="L"><span class="pill">No. ${esc(j.num)}</span><b class="pn" title="${esc(j.name)}">${esc(j.name)}</b><div class="mu ell2" title="${esc(j.location)}">📍 ${esc(j.location)||"—"}</div></div>
  <div class="R">${acBtns("jobs",j.id)}<div class="mu ell2" title="${esc(j.contact)}">📞 ${esc(j.contact)||"—"}</div>
  <div class="nv2"><label>Next visit</label><input type="date" value="${esc(j.next)}" data-k="jobs" data-id="${j.id}" data-set="next">${dueTag(j.next,j.status)}</div></div></div>`).join("");
  return`<div class="stats">${stat(list.length,"Total jobs","","tot")}${stat(open,"Open","","opn")}${stat(list.length-open,"Completed","","dn")}</div>
  ${cards?`<div class="pgrid">${cards}</div>`:(S.jobs.length?ES("Nothing in this period","Try a different filter period to see more."):ES("No "+S.cfg.labels.work.toLowerCase()+"s yet","Add your first landscaping, home garden or rooftop garden to start tracking work, payments and invoices.",1))}`;
}
/* project tile used on Money and Invoices */
function pTile(p,mode,click){
  const f=pFin(p.id),n=mode==="inv"?f.inv.length:mode==="money"?f.tx.length:f.tx.length+f.inv.length;
  let left=`<span class="pill">${p.id==="__none"?"No project":"No. "+esc(p.num)}</span><b class="pn" title="${esc(p.name)}">${esc(p.name)}</b><div class="mu">${n} record${n===1?"":"s"}</div>`,right;
  if(mode==="money")right=mrow("Income",num(f.income),"gr")+mrow("Expenses",num(f.exp),"rd")+mrow("Net",sgn(f.net),col(f.net));
  else if(mode==="inv")right=mrow("Invoiced",num(f.invd))+mrow("Paid",num(f.paid),"gr")+mrow("Pending",num(f.pend),"am");
  else{
    const w=f.net>0?"Profit":f.net<0?"Loss":"Break-even";
    left+=`<span class="bdg ${col(f.net)}">${w}</span><div class="mu">Invoiced: ${num(f.invd)}</div><div class="mu">Invoiced − expenses: <b class="${col(f.diff)}">${sgn(f.diff)}</b></div>`;
    right=mrow("Income",num(f.income),"gr")+mrow("Expenses",num(f.exp),"rd")+mrow("Net "+w.toLowerCase(),num(Math.abs(f.net)),col(f.net));
  }
  return`<div class="pc ${click?"click":""}" ${click?`data-act="selp" data-pid="${p.id}"`:""}><div class="L">${left}</div><div class="R"><div class="ac"><button class="ib" data-act="padd" data-pid="${p.id}" title="Add entry">＋</button></div>${right}</div></div>`;
}
function txTile(t){const i=t.type==="Income",nt=cl(t).join(", ");
  return`<div class="pc" data-rid="${t.id}"><div class="L"><span class="pill ${i?"gr":"rd"}">${esc(t.type)}</span><b class="pn ${i?"gr":"rd"}">${i?"+":"−"}${num(t.amt)}</b><div class="mu ell2" title="${esc(nt)}">${esc(nt)}</div></div>
  <div class="R">${acBtns("tx",t.id,!!t.inv)}<div class="mu">${esc(t.date)}</div>${t.note?`<div class="mu ell2" title="${esc(t.note)}">${esc(t.note)}</div>`:""}${t.inv?'<div class="mu">🔗 Paid invoice</div>':""}</div></div>`}
function invTile(i){
  return`<div class="pc" data-rid="${i.id}"><div class="L"><span class="pill">Invoice</span><b class="pn">${num(i.amt)}</b><div class="mu ell2" title="${esc(i.ref)}">${esc(i.ref)||"—"}</div></div>
  <div class="R">${acBtns("inv",i.id)}<div class="mu">${esc(i.date||"—")}</div><select data-k="inv" data-id="${i.id}" data-set="status">${opts(IS,i.status)}</select></div></div>`}
function projHead(){
  return`<div class="card" style="padding:8px"><div class="row" style="align-items:center"><button class="btn g sm" data-act="selp" data-pid="">← All projects</button><select id="psw" class="mini">${projs().map(p=>`<option value="${p.id}" ${p.id===selProj?"selected":""}>${esc(p.id==="__none"?p.name:p.num+". "+p.name)}</option>`).join("")}</select></div></div>`}
const grid=(a,fn,empty)=>a.length?`<div class="pgrid">${a.map(fn).join("")}</div>`:`<div class="empty">${empty}</div>`;
const NONE="No records found. Tap + to add one.";
const CT=["Home","Rooftop","Commercial","Other"];
let selCust=null,cq="";
const digits=x=>String(x||"").replace(/\D/g,"");
const AS='style="flex:1;display:grid;place-items:center;text-align:center;text-decoration:none;min-height:40px"';
const custJobs=id=>S.jobs.filter(j=>j.customer===id);
function custFin(id){const js=custJobs(id),ids=new Set(js.map(j=>j.id)),iv=S.inv.filter(i=>ids.has(i.job)),t=sumA(iv),p=sumA(iv.filter(i=>i.status==="Paid"));return{n:js.length,t,due:t-p}}
function dupOf(r){return S.customers.find(c=>c.id!==r.id&&((digits(r.phone).length>=7&&digits(c.phone)===digits(r.phone))||(r.email&&c.email&&c.email.toLowerCase()===r.email.toLowerCase())))}
function custList(){
  const q=cq.trim().toLowerCase(),qd=digits(cq);
  const a=S.customers.filter(c=>!q||[c.name,c.code,c.email,c.address].some(x=>String(x||"").toLowerCase().includes(q))||(qd&&digits(c.phone).includes(qd))||S.jobs.some(j=>j.customer===c.id&&String(j.location||"").toLowerCase().includes(q))).sort((x,y)=>x.name.localeCompare(y.name));
  if(!S.customers.length)return ES("No customers yet","Add your customers once, then link every project, invoice and visit to them.","cust");
  return a.length?`<div class="pgrid">${a.map(c=>{const f=custFin(c.id);return`<div class="pc click" data-act="csel" data-id="${c.id}"><div class="L"><span class="pill">${esc(c.code||c.type)}</span><b class="pn" title="${esc(c.name)}">${esc(c.name)}</b><div class="mu ell2">📞 ${esc(c.phone)||"—"}</div></div><div class="R">${mrow("Jobs",f.n)}${mrow("Outstanding",num(f.due),f.due>0?"am":"")}</div></div>`}).join("")}</div>`:'<div class="empty">No customer matches your search.</div>';
}
function vCust(){
  const C=S.customers.find(c=>c.id===selCust);
  if(!C)return`<div class="card" style="padding:8px"><input id="cq" class="mini" style="width:100%" type="search" placeholder="Search name, phone, ID or address" value="${esc(cq)}"></div><div id="clist">${custList()}</div>`;
  const f=custFin(C.id),js=custJobs(C.id).sort((a,b)=>(+b.num||0)-(+a.num||0)),wa=digits(C.whatsapp||C.phone);
  return`<div class="card" style="padding:8px"><button class="btn g sm" data-act="csel" data-id="">← All customers</button></div>
  <div class="card"><div class="row"><div><span class="pill">${esc(C.code||"New")}</span> <span class="pill">${esc(C.type)}</span><h2 style="font-size:18px;margin:8px 0 4px;color:var(--brand)">${esc(C.name)}</h2></div>${acBtns("customers",C.id)}</div>
  <div class="mu">📞 ${esc(C.phone)||"—"} · ✉ ${esc(C.email)||"—"}</div><div class="mu">📍 ${esc(C.address)||"—"}</div>${C.notes?`<div class="pre" style="margin-top:6px">${esc(C.notes)}</div>`:""}
  <div class="acts">${C.phone?`<a class="btn sm" ${AS} href="tel:${esc(C.phone)}">Call</a>`:""}${wa?`<a class="btn g sm" ${AS} href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}<button class="btn g sm" data-act="cjob" data-id="${C.id}">+ ${esc(S.cfg.labels.work)}</button></div></div>
  <div class="stats">${stat(f.n,"Jobs","","tot")}${stat(num(f.t),"Invoiced")}${stat(num(f.due),"Outstanding",f.due>0?"am":"","opn")}</div>
  <div class="sh">${esc(S.cfg.labels.work)}s (${js.length})</div>${grid(js,j=>`<div class="pc"><div class="L"><span class="pill">No. ${esc(j.num)}</span><b class="pn">${esc(j.name)}</b><span class="bdg ${stCls(j.status)}">${esc(j.status)}</span></div><div class="R"><div class="mu ell2">📍 ${esc(j.location)||"—"}</div><div class="mu">Next visit: ${esc(j.next)||"—"}</div></div></div>`,"No projects yet for this customer.")}`;
}
function addCustForm(){
  show(`<h3>New customer</h3>${F("Name",'<input id="c_name">',1)}${F("Phone",'<input id="c_phone" type="tel" inputmode="tel">')}${F("WhatsApp (if different)",'<input id="c_wa" type="tel" inputmode="tel">')}${F("Email",'<input id="c_email" type="email">')}${F("Address",'<textarea id="c_addr" rows="3"></textarea>')}${F("Customer type",`<select id="c_type">${opts(CT)}</select>`)}${F("Notes",'<textarea id="c_notes" rows="3"></textarea>')}<div class="acts"><button class="btn g" id="no">Cancel</button><button class="btn" id="yes">Add customer</button></div>`);
  $("#no").onclick=hide;
  $("#yes").onclick=async()=>{
    if(busy)return;const name=gv("c_name");if(!need([["c_name",!!name]]))return;
    const rec={id:uid(),name,phone:gv("c_phone"),whatsapp:gv("c_wa"),email:gv("c_email"),address:gv("c_addr"),type:gv("c_type"),notes:gv("c_notes")};
    busy=true;
    try{const d=dupOf(rec);if(d&&!await ask("This looks like an existing customer: "+d.name+". Add a new record anyway?","Add anyway"))return;
      hide();S.customers.push(rec);save();selCust=rec.id;tab="cust";lastAdded=rec.id;render()}finally{busy=false}
  };
}
const LOGO0=document.querySelector(".logo").innerHTML;
function readLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;
  im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);let d=c.toDataURL("image/png");if(d.length>250000)d=c.toDataURL("image/jpeg",.85);res(d)};im.src=r.result};r.readAsDataURL(file)})}
const IC={cust:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',work:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.5 6-7"/>',
 money:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 inv:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
 act:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>'};
const ES=(t,m,btn)=>`<div class="es"><svg viewBox="0 0 132 112" aria-hidden="true"><circle cx="66" cy="58" r="46" fill="#F0FDF4"/><path d="M66 78V48" stroke="#14532D" stroke-width="3" stroke-linecap="round"/><path d="M66 56C66 44 56 36 44 38c0 12 8 20 22 18Z" fill="#0D9488"/><path d="M66 48C66 34 78 26 92 29c0 14-10 22-26 19Z" fill="#14532D"/><path d="M46 78h40l-4 22a4 4 0 0 1-4 3H54a4 4 0 0 1-4-3Z" fill="#14532D"/><rect x="43" y="73" width="46" height="8" rx="3" fill="#166534"/><path d="M24 104h84" stroke="#BBF7D0" stroke-width="3" stroke-linecap="round"/></svg><h3>${t}</h3><p>${m}</p>${btn?`<button class="btn" data-act="${btn==="cust"?"addCust":"addProj"}">${btn==="cust"?"+ Add Customer":"+ Add "+esc(S.cfg.labels.work)}</button>`:""}</div>`;
function overview(mode){const P=projs();return P.length?`<div class="pgrid">${P.map(p=>pTile(p,mode,true)).join("")}</div>`: ES("Add a project first","Money, invoices and activity are tracked for each project.",1)}
function vMoney(){
  const P=projs().find(p=>p.id===selProj);
  if(P){const f=pFin(P.id);
    return projHead()+`<div class="pgrid">${pTile(P,"money",false)}</div><div class="sh">Money entries (${f.tx.length})</div>${grid([...f.tx].sort((a,b)=>b.date.localeCompare(a.date)),txTile,NONE)}`}
  const tx=S.tx.filter(t=>inF(t.date)),inc=sumA(tx.filter(t=>t.type==="Income")),exp=sumA(tx.filter(t=>t.type==="Expense"));
  return`<div class="stats">${stat(num(inc),"Income","gr")}${stat(num(exp),"Expenses","rd")}${stat(sgn(inc-exp),"Net",col(inc-exp))}</div>${overview("money")}`;
}
function vInv(){
  const P=projs().find(p=>p.id===selProj),note=`<div class="note">When an invoice is marked Paid, its amount is added to ${esc(S.cfg.labels.money)} as income.</div>`;

function renderFlt(){$("#flt").innerHTML=""}

load();apply(S.cfg);render();if(sbConfigured())initSB();else if(typeof claude!=="undefined")initCloud();else sbSetupForm();
